[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # CommonJS packages that use dynamic require() break when esbuild inlines them
  # into an ESM bundle; shipping them as regular node_modules avoids that.
  external_node_modules = ["express", "serverless-http", "cookie-parser", "jsonwebtoken", "bcryptjs"]

# The API function claims /api/* itself (export const config in netlify/functions/api.ts).

# SPA fallback for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
